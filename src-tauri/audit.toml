# cargo-audit configuration
# Run with: cargo audit --config audit.toml

[advisories]
# All current warnings are transitive from Tauri's webview backend
# (gtk-rs GTK3 stack, kuchikiki HTML parser) and cannot be fixed from
# our side. They must be addressed upstream by the Tauri team.
ignore = [
    # gtk-rs GTK3 bindings — unmaintained (Tauri webkit2gtk backend)
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414", "RUSTSEC-2024-0415", "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417", "RUSTSEC-2024-0418", "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420", "RUSTSEC-2024-0429",
    # fxhash, glib, proc-macro-error, etc. — unmaintained transitive
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0370",
    # rand 0.8.5 unsound with custom logger — unreachable in our code path
    "RUSTSEC-2026-0097",
]

[output]
deny = ["unsound", "yanked"]

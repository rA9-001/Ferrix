# cargo-deny configuration
# Install: cargo install cargo-deny --locked
# Run:     cargo deny check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Tauri webview backend (gtk-rs GTK3) — unmaintained transitive deps.
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414", "RUSTSEC-2024-0415", "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417", "RUSTSEC-2024-0418", "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420", "RUSTSEC-2024-0429",
    # Other unmaintained transitive crates pulled in by Tauri / kuchikiki.
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2024-0370", # proc-macro-error
    # rand 0.8.5 unsound w/ custom logger — not exercised by our code paths.
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "MIT", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-DFS-2016", "Unicode-3.0",
    "MPL-2.0", "CC0-1.0", "0BSD",
    "Apache-2.0 OR MIT", "MIT OR Apache-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No openssl-sys — prefer rustls.
    # Keep this list short; expand with project-specific bans.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
